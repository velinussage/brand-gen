<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dembrandt landing hero</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f2eee6;
        font-family: sohne-var, "Helvetica Neue", Arial, sans-serif;
      }
      .frame {
        width: min(94vw, 1600px);
        box-shadow: 0 32px 80px rgba(42, 35, 26, 0.12);
        border-radius: 24px;
        overflow: hidden;
      }
      img {
        width: 100%;
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <div class="frame">
      <img src="v1-token-aware-test.svg" alt="Dembrandt landing hero" />
    </div>
  </body>
</html>
