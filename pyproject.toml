[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brand-gen"
version = "0.1.0"
description = "Agent-driven brand material generation and iteration toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "dataclasses-json>=0.6.7",
  "Pillow>=10.0",
]

[project.scripts]
bgen = "brand_gen.cli:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
# Scoring extras — install with `pip install -e '.[scoring]'`.
# DSPy 3.x for structured LLM calls; scipy for weighted Cohen's kappa.
# Pinned exactly: 3.x minor versions have breaking changes in the GEPA
# optimizer API and the multimodal adapter. GEPA ships as a transitive
# dep of dspy-ai (native dspy.GEPA in 3.x).
scoring = [
  "dspy-ai==3.1.3",
  "scipy>=1.10",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["brand_gen*"]
